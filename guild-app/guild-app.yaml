apiVersion: v1
kind: ConfigMap
metadata:
  name: guild-app-page
  labels:
    app: guild-app
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <title>Azure Guild</title>
      </head>
      <body>
        <h1>Hello, Azure Guild!</h1>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guild-app
  labels:
    app: guild-app         # ook de deployment krijgt label app: guild-app (gebruikelijk, maar niet verplicht)
spec:
  replicas: 2          # zorg ervoor dat er 2 pods gaan draaien
  selector:
    matchLabels:
      app: guild-app       # pods die al draaien
  template:
    metadata:
      labels:
        app: guild-app     # nieuw aan te maken pods moeten label app: guild-app krijgen
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: guild-app-page
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: guild-app-page
          configMap:                # Koppelt de configMap (hierboven) aan de inhoud van de pod
            name: guild-app-page
