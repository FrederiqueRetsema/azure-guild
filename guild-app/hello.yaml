# A simple single pod that serves a static "Hello, Azure Guild!" web page.
# nginx serves the index.html provided by the ConfigMap below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-page
  labels:
    app: hello
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <title>Azure Guild</title>
      </head>
      <body>
        <h1>Hello, Azure Guild!</h1>
      </body>
    </html>
---
apiVersion: v1
kind: Pod
metadata:
  name: hello
  labels:
    app: hello
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - name: http
          containerPort: 80
      volumeMounts:
        - name: hello-page
          mountPath: /usr/share/nginx/html
          readOnly: true
  volumes:
    - name: hello-page
      configMap:
        name: hello-page
