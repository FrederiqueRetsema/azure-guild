apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: deploymentandservices.apps.azure-guild.io
  annotations:
    # Apply the XRD first and wait for it to be established.
    argocd.argoproj.io/sync-wave: "0"
spec:
  scope: Namespaced
  group: apps.azure-guild.io
  names:
    kind: DeploymentAndService
    plural: deploymentandservices
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  description: Container image the Deployment runs.
                  type: string
                replicas:
                  description: Number of Deployment replicas.
                  type: integer
                  default: 2
                  minimum: 1
                containerPort:
                  description: Port the container listens on.
                  type: integer
                  default: 80
                nodePort:
                  description: >-
                    NodePort to expose. Must be in the 30000-32767 range.
                  type: integer
                  default: 30080
                  minimum: 30000
                  maximum: 32767
              required:
                - image
            status:
              type: object
              properties:
                availableReplicas:
                  description: Number of available replicas reported by the Deployment.
                  type: integer
                clusterIP:
                  description: ClusterIP assigned to the Service.
                  type: string
