    # and the Compositions exist to be selected.
    argocd.argoproj.io/sync-wave: "2"
spec:
  compositionSelector:
    matchLabels:
      cloud: azure
  secretName: azure-guild-mysql-admin-portable-database
  resourceGroupName: frederique-azure-guild
  serverName: azure-guild-mysql-crossplane
  size: XS
