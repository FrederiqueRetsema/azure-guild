  name: azure-guild-mysql-admin-portable-database
  namespace: crossplane-system
  annotations:
    # Admin credentials must exist before the composite resources are created.
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  password: "ChangeMe-Str0ng-P@ssw0rd!"
---
apiVersion: db.azure-guild.io/v1alpha1
kind: MySQL2
metadata:
